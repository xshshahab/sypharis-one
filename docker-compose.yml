# Run everything with:  docker compose up --build -d
#   Frontend: http://localhost:3000
#   Backend:  http://localhost:8000  (docs: /docs, health: /api/v1/health)
#   Postgres: 127.0.0.1:5432 (internal Docker hostname: postgres)
#
# Secrets come from the root .env file (never copied into the images).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sypharis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sypharis}
      POSTGRES_DB: ${POSTGRES_DB:-sypharis}
    ports:
      # Bound to localhost only so Postgres is never exposed publicly on a VPS
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sypharis} -d ${POSTGRES_DB:-sypharis}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      # Uses the internal Docker Postgres service by default (overrides .env DATABASE_URL)
      DATABASE_URL: postgresql://${POSTGRES_USER:-sypharis}:${POSTGRES_PASSWORD:-sypharis}@postgres:5432/${POSTGRES_DB:-sypharis}?sslmode=disable
      # Frontend address(es) allowed to call the API from the browser
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Must be reachable from the browser, not a Docker service name
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
